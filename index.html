      slide.appendChild(printersPanel);
    }

    sec.items.forEach((item, ii) => {
      slide.appendChild(buildItemCard(si, ii, item));
    });

    DOM.slidesTrack.appendChild(slide);
  });
}

function buildItemCard(si, ii, label) {
  const key = `${si}-${ii}`;
  const card = document.createElement('div');
  card.className = 'item-card';
  card.id = `card-${key}`;
  card.dataset.label = label.toLowerCase();
  card.dataset.si = si;
  card.dataset.ii = ii;

  card.innerHTML = `
    <div class="item-main">
      <div class="item-status-stripe"></div>
      <span class="item-label" id="lbl-${key}">${label}</span>
      <div class="item-actions">
        <button class="status-btn btn-ok"   data-key="${key}" data-s="ok"   aria-label="OK"      title="OK">✓</button>
        <button class="status-btn btn-warn" data-key="${key}" data-s="warn" aria-label="Atenção" title="Atenção">!</button>
        <button class="status-btn btn-crit" data-key="${key}" data-s="crit" aria-label="Crítico" title="Crítico">✗</button>
        <button class="status-btn btn-na"   data-key="${key}" data-s="na"   aria-label="N/A"     title="Não se aplica">—</button>
      </div>
    </div>
    <div class="item-details" id="det-${key}">
      <div class="item-details-inner">
        <div class="detail-row">
          <span class="detail-label">Quantidade</span>
          <input type="number" class="detail-input qty-input" id="qty-${key}" placeholder="0" min="0" value="">
        </div>
        <div class="detail-row" style="align-items:flex-start">
          <span class="detail-label" style="padding-top:6px">Observação</span>
          <textarea class="detail-input obs-input" id="obs-${key}" placeholder="Adicione detalhes, número de série, modelo..."></textarea>
        </div>
        <div class="item-timestamp" id="ts-${key}"></div>
      </div>
    </div>`;

  card.querySelectorAll('.status-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      handleStatusClick(btn.dataset.key, btn.dataset.s);
    });
  });

  const qtyIn = card.querySelector(`#qty-${key}`);
  const obsIn = card.querySelector(`#obs-${key}`);
  if (qtyIn) qtyIn.addEventListener('input', debounce(e => { State.items[key].qty = e.target.value; autoSave(); }, 300));
  if (obsIn) obsIn.addEventListener('input', debounce(e => { State.items[key].obs = e.target.value; autoSave(); }, 300));

  return card;
}

function buildTabNav() {
  DOM.sectionTabs.innerHTML = '';

  // Dashboard tab
  const dashTab = document.createElement('button');
  dashTab.className = 'tab-btn';
  dashTab.id = 'tab-dashboard';
  dashTab.setAttribute('role', 'tab');
  dashTab.setAttribute('aria-selected', 'false');
  dashTab.innerHTML = `
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:4px;vertical-align:-2px"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
    Dash`;
  dashTab.addEventListener('click', () => goToTab(-1));
  DOM.sectionTabs.appendChild(dashTab);

  SECTIONS.forEach((sec, si) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn';
    btn.id = `tab-${si}`;
    btn.setAttribute('role', 'tab');
    btn.setAttribute('aria-selected', 'false');
    btn.innerHTML = `${sec.title}<span class="tab-badge" id="tbadge-${si}">${sec.items.length}</span>`;
    btn.addEventListener('click', () => goToTab(si));
    DOM.sectionTabs.appendChild(btn);
  });
}

function goToTab(si) {
  // Se estava em modo de busca global (lista vertical), navegar para
  // uma aba específica volta ao carrossel normal daquela seção.
  if (State.ui.searchQuery) {
    clearSearch();
  }

  State.ui.currentTab = si;
  const trackOffset = si === -1 ? 0 : (si + 1);
  DOM.slidesTrack.style.transform = `translateX(-${trackOffset * 100}vw)`;

  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    const isActive = (si === -1 && i === 0) || (si >= 0 && i === si + 1);
    b.classList.toggle('active', isActive);
    b.setAttribute('aria-selected', isActive ? 'true' : 'false');
  });

  // Scroll active tab into view
  const activeTab = si === -1
    ? document.getElementById('tab-dashboard')
    : document.getElementById(`tab-${si}`);
  if (activeTab) activeTab.scrollIntoView({ behavior: document.documentElement.classList.contains('fx') ? 'smooth' : 'auto', block: 'nearest', inline: 'center' });

  updateTabBadges();
  if (si === -1) updateDashboard();
}

function handleStatusClick(key, newStatus) {
  const s = State.items[key];
  const prev = s.status;
  const same = prev === newStatus;

  s.status = same ? null : newStatus;
  if (!same) s.ts = new Date().toISOString();
  else s.ts = null;

  // Update card
  const card = document.getElementById(`card-${key}`);
  if (!card) return;

  card.className = 'item-card';
  if (s.status) card.classList.add(`has-${s.status}`);

  // Update buttons
  card.querySelectorAll('.status-btn').forEach(b => {
    b.classList.toggle('sel', b.dataset.s === s.status);
  });

  // Toggle details
  const det = document.getElementById(`det-${key}`);
  if (det) det.classList.toggle('open', s.status !== null);

  // Update timestamp
  const tsEl = document.getElementById(`ts-${key}`);
  if (tsEl && s.ts) {
    const d = new Date(s.ts);
    tsEl.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>${d.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'})}`;
  } else if (tsEl) {
    tsEl.innerHTML = '';
  }

  // Pulse animation
  card.classList.add('just-selected');
  setTimeout(() => card.classList.remove('just-selected'), 500);

  updateProgress();
  updateTabBadges();
  autoSave();

}

/* PROGRESS */
function updateProgress() {
  const total = State.totalItems();
  const done  = State.doneItems();
  const okC   = State.countBy('OK');
  const warnC = State.countBy('ATENÇÃO');
  const critC = State.countBy('CRÍTICO');
  const naC   = State.countBy('N/A');
  const pct   = State.pct();

  DOM.progressFill.style.width = pct + '%';
  DOM.progressFill.classList.toggle('has-value', pct > 0);
  DOM.progressPct.textContent = pct + '%';
  DOM.progressCount.textContent = `${done}/${total}`;
  DOM.miniOk.textContent   = okC;
  DOM.miniWarn.textContent = warnC;
  DOM.miniCrit.textContent = critC;
  DOM.miniNa.textContent   = naC;
}

function updateTabBadges() {
  SECTIONS.forEach((sec, si) => {
    const badge = document.getElementById(`tbadge-${si}`);
    const tab   = document.getElementById(`tab-${si}`);
    if (!badge || !tab) return;

    const keys   = sec.items.map((_, ii) => `${si}-${ii}`);
    const done   = keys.filter(k => State.items[k]?.status !== null).length;
    const crits  = keys.filter(k => State.items[k]?.status === 'crit').length;
    const warns  = keys.filter(k => State.items[k]?.status === 'warn').length;
    const allOk  = done === keys.length && crits === 0 && warns === 0;

    badge.textContent = done === sec.items.length ? '✓' : crits > 0 ? crits : done > 0 ? done : sec.items.length;
    tab.className = 'tab-btn' + (crits > 0 ? ' has-crit' : warns > 0 ? ' has-warn' : allOk ? ' all-ok' : '');
    if (State.ui.currentTab === si) tab.classList.add('active');
  });
}

/* DASHBOARD */
function updateDashboard() {
  const score = State.overallScore();
  const grade = State.grade();
  const okC   = State.countBy('ok');
  const warnC = State.countBy('warn');
  const critC = State.countBy('crit');
  const naC   = State.countBy('na');
  const done  = State.doneItems();
  const total = State.totalItems();
  const pct   = State.pct();

  // Score box
  const scoreEl = document.getElementById('dashScore');
  const gradeEl = document.getElementById('dashGrade');
  const subEl   = document.getElementById('dashScoreSub');
  if (scoreEl) scoreEl.textContent = done ? score : '—';
  if (gradeEl) { gradeEl.textContent = done ? grade : '—'; gradeEl.className = `score-grade grade-${grade.toLowerCase()}`; }
  if (subEl)   {
    subEl.textContent = !done ? 'Sem dados' : critC > 0 ? `${critC} crítico${critC>1?'s':''}` : 'Sem críticos';
    subEl.style.color = critC > 0 ? 'var(--crit)' : done ? 'var(--ok)' : 'var(--text-muted)';
  }

  // Pills
  const okEl   = document.getElementById('dOk');
  const warnEl = document.getElementById('dWarn');
  const critEl = document.getElementById('dCrit');
  const naEl   = document.getElementById('dNa');
  if (okEl)   okEl.textContent   = okC;
  if (warnEl) warnEl.textContent = warnC;
  if (critEl) critEl.textContent = critC;
  if (naEl)   naEl.textContent   = naC;

  // Progress
  const ppEl = document.getElementById('dashProgressPct');
  const pfEl = document.getElementById('dashProgressFill');
  const psEl = document.getElementById('dashProgressSub');
  if (ppEl) ppEl.textContent = pct + '%';
  if (pfEl) pfEl.style.width = pct + '%';
  if (psEl) psEl.textContent = `${done} de ${total} itens avaliados`;

  // Bar chart
  const barsEl   = document.getElementById('dashBars');
  const labelsEl = document.getElementById('dashBarLabels');
  if (barsEl) {
    barsEl.innerHTML = '';
    if (labelsEl) labelsEl.innerHTML = '';
    SECTIONS.forEach((sec, si) => {
      const keys  = sec.items.map((_, ii) => `${si}-${ii}`);
      const okN   = keys.filter(k => State.items[k]?.status === 'ok').length;
      const critN = keys.filter(k => State.items[k]?.status === 'crit').length;
      const warnN = keys.filter(k => State.items[k]?.status === 'warn').length;
      const total = keys.length;
      const ht    = Math.max(3, Math.round((okN / total) * 56));
      const color = critN > 0 ? 'var(--crit)' : warnN > 0 ? 'var(--warn)' : okN > 0 ? 'var(--ok)' : 'var(--border-strong)';

      const bar = document.createElement('div');
      bar.className = 'chart-bar-wrap';
      bar.innerHTML = `
        <div class="chart-bar" style="height:${ht}px;background:${color}" onclick="goToTab(${si})">
          <div class="chart-bar-tooltip">${sec.title}: ${Math.round(okN/total*100)}%</div>
        </div>`;
      barsEl.appendChild(bar);

      if (labelsEl) {
        const lbl = document.createElement('div');
        lbl.className = 'chart-bar-lbl';
        lbl.textContent = sec.title.substring(0, 4);
        labelsEl.appendChild(lbl);
      }
    });
  }

  // Critical items
  const critCard = document.getElementById('criticalCard');
  const critList = document.getElementById('criticalList');
  const critBadge= document.getElementById('critCountBadge');
  if (critCard && critList && critC > 0) {
    critCard.classList.remove('hidden');
    critBadge.textContent = critC;
    critList.innerHTML = '';
    SECTIONS.forEach((sec, si) => {
      sec.items.forEach((item, ii) => {
        const key = `${si}-${ii}`;
        if (State.items[key]?.status === 'crit') {
          const el = document.createElement('div');
          el.className = 'critical-item';
          el.innerHTML = `
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--crit)" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span>${item}</span>
            <span class="critical-item-sec">${sec.title}</span>`;
          el.addEventListener('click', () => goToTab(si));
          critList.appendChild(el);
        }
      });
    });
  } else if (critCard) {
    critCard.classList.add('hidden');
  }

  // Section health
  const shList = document.getElementById('sectionHealthList');
  if (shList) {
    shList.innerHTML = '';
    SECTIONS.forEach((sec, si) => {
      const keys = sec.items.map((_, ii) => `${si}-${ii}`);
      const done = keys.filter(k => State.items[k]?.status !== null).length;
      const ok   = keys.filter(k => State.items[k]?.status === 'ok').length;
      const crit = keys.filter(k => State.items[k]?.status === 'crit').length;
      const pct  = keys.length ? Math.round(done / keys.length * 100) : 0;
      const color= crit > 0 ? 'var(--crit)' : ok >= keys.length ? 'var(--ok)' : done > 0 ? 'var(--warn)' : 'var(--border-strong)';

      const el = document.createElement('div');
      el.className = 'sh-row';
      el.innerHTML = `
        <span class="sh-label">${sec.icon} ${sec.title}</span>
        <div class="sh-bar-wrap">
          <div class="sh-bar-track">
            <div class="sh-bar-fill" style="width:${pct}%;background:${color}"></div>
          </div>
        </div>
        <span class="sh-pct" style="color:${color}">${pct}%</span>`;
      shList.appendChild(el);
    });
  }

}

/* A busca é GLOBAL: funciona em qualquer seção, independente da aba
   atualmente aberta. Quando há texto digitado, o carrossel horizontal
   (que mostra só uma seção por vez) é substituído por uma lista
   vertical com TODAS as seções, exibindo apenas os itens que batem
   com a busca/filtro — cada um já identificado com sua seção de origem. */
function applyFilters() {
  const q = State.ui.searchQuery;
  const f = State.ui.activeFilter;
  const globalSearchMode = q.length > 0;

  const track = DOM.slidesTrack;
  const emptyState = document.getElementById('searchModeEmpty');
  track.classList.toggle('search-mode', globalSearchMode);

  let anyVisibleAnywhere = false;

  SECTIONS.forEach((sec, si) => {
    const slideEl = document.getElementById(`slide-${si}`);
    let sectionHasVisible = false;

    sec.items.forEach((label, ii) => {
      const key = `${si}-${ii}`;
      const card = document.getElementById(`card-${key}`);
      if (!card) return;
      const item = State.items[key];
      const status = item?.status;
      const cardLabel = card.dataset.label || '';

      let visible = true;

      // Search filter (busca em qualquer seção, não só na aberta)
      if (q && !cardLabel.includes(q)) visible = false;

      // Status filter
      if (f === 'pending' && status !== null) visible = false;
      if (f === 'ok'      && status !== 'ok')   visible = false;
      if (f === 'warn'    && status !== 'warn')  visible = false;
      if (f === 'crit'    && status !== 'crit')  visible = false;

      card.classList.toggle('filtered-out', !visible);
      if (visible) { sectionHasVisible = true; anyVisibleAnywhere = true; }

      // Highlight search + mostra a seção de origem do item no modo global
      const labelEl = card.querySelector('.item-label');
      if (q && visible) {
        if (labelEl) {
          const re = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
          const prefix = globalSearchMode ? `<span class="item-section-tag">${sec.icon} ${sec.title}</span> ` : '';
          labelEl.innerHTML = prefix + label.replace(re, '<mark>$1</mark>');
        }
        card.classList.add('highlight-search');
      } else {
        if (labelEl) labelEl.textContent = label;
        card.classList.remove('highlight-search');
      }
    });

    if (slideEl) slideEl.classList.toggle('has-search-results', globalSearchMode && sectionHasVisible);
  });

  if (emptyState) emptyState.classList.toggle('show', globalSearchMode && !anyVisibleAnywhere);
}

/* SWIPE NAVIGATION */
function setupSwipe() {
  const vp = document.querySelector('.slides-viewport');
  let touchStartX = 0, touchStartY = 0, startTab = 0;
  let isDragging = false;

  vp.addEventListener('touchstart', e => {
    if (State.ui.searchQuery) return; // sem swipe de aba durante busca global
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    startTab = State.ui.currentTab;
    isDragging = false;
  }, { passive: true });

  vp.addEventListener('touchmove', e => {
    if (State.ui.searchQuery) return;
    const dx = e.touches[0].clientX - touchStartX;
    const dy = e.touches[0].clientY - touchStartY;
    if (!isDragging && Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10) {
      isDragging = true;
    }
  }, { passive: true });

  vp.addEventListener('touchend', e => {
    if (State.ui.searchQuery) return;
    if (!isDragging) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;

    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 45) {
      const cur = State.ui.currentTab;
      const maxTab = SECTIONS.length - 1;
      if (dx < 0 && cur < maxTab) goToTab(cur + 1);
      else if (dx > 0 && cur > -1) goToTab(cur - 1);
    }
  }, { passive: true });
}

function handleEmailAttachmentSelection(files) {
  Array.from(files || []).forEach(file => {
    if (file.size > 8 * 1024 * 1024) {
      showToast(`${file.name} excede 8 MB e não foi anexado.`, 'error');
      return;
    }
    const reader = new FileReader();
    reader.onload = function() {
      const item = { name: file.name, dataUrl: reader.result, type: file.type || 'application/octet-stream' };
      if ((file.type || '').startsWith('image/')) {
        const img = new Image();
        img.onload = () => { item.aspect = { w: img.naturalWidth || 160, h: img.naturalHeight || 105 }; selectedEmailAttachments.push(item); renderEmailAttachmentPreview(); };
        img.onerror = () => { selectedEmailAttachments.push(item); renderEmailAttachmentPreview(); };
        img.src = reader.result;
      } else {
        selectedEmailAttachments.push(item);
        renderEmailAttachmentPreview();
      }
    };
    reader.readAsDataURL(file);
  });
}

function clearEmailAttachments() {
  selectedEmailAttachments = [];
  renderEmailAttachmentPreview();
}

function renderEmailAttachmentPreview() {
  const wrap = document.getElementById('emailAttachPreview');
  if (!wrap) return;
  if (!selectedEmailAttachments.length) {
    wrap.innerHTML = '';
    return;
  }
  wrap.innerHTML = selectedEmailAttachments.map(item => `<div class="mini-chip">${item.name}</div>`).join('');
}

function dataUriToBlob(dataUri) {
  const parts = dataUri.split(',');
  const mimeMatch = parts[0].match(/:(.*?);/);
  const mime = mimeMatch ? mimeMatch[1] : 'application/pdf';
  const binary = atob(parts[1]);
  const array = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) array[i] = binary.charCodeAt(i);
  return new Blob([array], { type: mime });
}

function previewEmailPdf() {
  const btn = document.getElementById('emailPreviewBtn');
  if (btn) {
    btn.disabled = true;
    btn.textContent = 'Gerando PDF...';
  }
  try {
    const dataUri = buildPdfReport();
    const blob = dataUriToBlob(dataUri);
    const url = URL.createObjectURL(blob);
    const previewWindow = window.open(url, '_blank', 'noopener,noreferrer');
    if (previewWindow) {
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    }
    showToast('PDF aberto para visualização.', 'success');
  } catch (e) {
    showToast('Não foi possível gerar a pré-visualização do PDF.', 'error');
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.textContent = 'Pré-visualizar PDF';
    }
  }
}

function escapeHtml(value) {
  return String(value || '').replace(/[&<>"']/g, match => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[match]));
}

function persistSavedSubmission(payload, status = 'Salvo') {
  const summary = buildEmailReportData().summary;
  const record = {
    id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
    timestamp: new Date().toISOString(),
    loja: summary.loja,
    data: summary.data,
    responsavel: summary.responsavel,
    regional: summary.regional,
    status,
    notes: '',
    from: State.user.email || 'sem-login',
    summary,
    itens: payload.itens || []
  };
  const list = loadSavedSubmissions();
  list.unshift(record);
  saveSavedSubmissions(list.slice(0, 200));
  return record;
}

function updateSavedSubmission(id, updates) {
  const list = loadSavedSubmissions();
  const item = list.find(entry => entry.id === id);
  if (!item) return;
  Object.assign(item, updates);
  saveSavedSubmissions(list);
}

function renderSavedSubmissions() {
  const wrap = document.getElementById('savedSubmissionsList');
  if (!wrap) return;
  const list = loadSavedSubmissions();
  if (!list.length) {
    wrap.innerHTML = '<div class="history-item"><strong>Nenhum salvamento encontrado.</strong><span>Os registros aparecerão aqui quando houver novas vistorias salvas.</span></div>';
    return;
  }
  wrap.innerHTML = list.map(item => `
    <div class="history-item">
      <strong>${escapeHtml(item.loja || 'Sem loja')} · ${escapeHtml(item.data || '')}</strong>
      <span>${escapeHtml(item.responsavel || 'Sem responsável')} · ${escapeHtml(item.regional || '')}</span>
      <span>${escapeHtml(item.summary?.loja || '')} · conformidade ${escapeHtml(item.summary?.conformidade || 0)}% · ${escapeHtml(item.status || 'Salvo')}</span>

function saveSubmissionRecord(id) {

function deleteSubmissionRecord(id) {

function loadPendingQueue() {
  try {
    const raw = localStorage.getItem(PENDING_QUEUE_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) { return []; }
}

function savePendingQueue(list) {
  try { localStorage.setItem(PENDING_QUEUE_KEY, JSON.stringify(list.slice(-50))); } catch (e) {}
}

function enqueuePendingSave(payload) {
  const queue = loadPendingQueue();
  queue.push({ id: `${Date.now()}-${Math.random().toString(36).slice(2,8)}`, createdAt: new Date().toISOString(), payload });
  savePendingQueue(queue);
}

async function postBackend(payload) {
  const url = getBackendUrl();
  if (!url) throw new Error('BACKEND_URL_NOT_CONFIGURED');
  const response = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
    body: JSON.stringify(payload)
  });
  if (!response.ok) throw new Error(`HTTP ${response.status}`);
  const text = await response.text();
  try { return text ? JSON.parse(text) : {}; } catch (_) { return {}; }
}

async function retryPendingSaves() {
  const queue = loadPendingQueue();
  if (!queue.length) {
    showToast('Não há pendências para reenviar.', 'info');
    return;
  }
  let ok = 0;
  const remaining = [];
  for (const entry of queue) {
    try { await postBackend(entry.payload); ok++; }
    catch (e) { remaining.push(entry); }
  }
  savePendingQueue(remaining);
  showToast(remaining.length ? `${ok} pendência(s) enviada(s); ${remaining.length} ainda aguardando.` : `${ok} pendência(s) enviada(s) com sucesso.`, remaining.length ? 'info' : 'success');
}

function importChecklistBackup() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json,.json';
  input.onchange = () => {
    const file = input.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const payload = JSON.parse(reader.result);
        if (!payload || !Array.isArray(payload.itens)) throw new Error('Formato inválido');
        localStorage.setItem('checklist-data', JSON.stringify(payload));
        if (Array.isArray(payload.impressoras)) {
          State.printers = Object.fromEntries(payload.impressoras.map((item, idx) => [item.key || `imported-${idx}`, {
            status: item.status || null,
            obs: item.observacao || '',
            ts: item.ts || null
          }]));
          localStorage.setItem(PRINTERS_DRAFT_KEY, JSON.stringify(State.printers));
        }
        showToast('Backup importado. Recarregue a página para aplicar todos os campos.', 'success');
      } catch (e) {
        showToast('Backup inválido ou corrompido.', 'error');
      }
    };
    reader.readAsText(file, 'utf-8');
  };
  input.click();
}

function buildEmailReportData() {
  const loja = document.getElementById('fLoja').value || 'Loja';
  const data = document.getElementById('fData').value || new Date().toLocaleDateString('pt-BR');
  const resp = document.getElementById('fResp').value || 'Responsável';
  const reg = document.getElementById('fReg').value || 'Regional';
  const now = new Date();
  const total = State.totalItems();
  const done = State.doneItems();
  const crit = State.countBy('crit');
  const warn = State.countBy('warn');
  const ok = State.countBy('ok');
  const pct = total ? Math.round((done / total) * 100) : 0;
  const printerRows = buildPrinterExportRows();
  const summary = {
    loja,
    data,
    responsavel: resp,
    regional: reg,
    total,
    concluido: done,
    conformidade: pct,
    crit,
    warn,
    ok,
    impressorasAvaliadas: printerRows.length,
    impressorasOk: printerRows.filter(p => p.status === 'ok').length,
    impressorasAtencao: printerRows.filter(p => p.status === 'warn').length,
    impressorasCriticas: printerRows.filter(p => p.status === 'crit').length,
    geradoEm: now.toLocaleString('pt-BR')
  };
  return { summary, rows: buildPayload().itens, printers: printerRows };
}

  try { doc.addImage(TENDA_LOGO_DATA_URL, 'PNG', 42, 34, 94, 60, undefined, 'FAST'); }
  catch (e) {
    doc.setFillColor(255,255,255);

    doc.setTextColor(25,74,137);
    doc.setFont('helvetica','bold'); doc.setFontSize(22); doc.text('Tenda', 54, 66);
  }

function buildPdfReport() {
  const { jsPDF } = window.jspdf;
  const report = buildEmailReportData();
  const doc = new jsPDF({ orientation: 'p', unit: 'pt', format: 'a4' });
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();
  let y = 124;

  addPdfHeader(doc, report);

  doc.setTextColor(15, 23, 42);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(14);
  doc.text('Resumo Executivo', 40, y);
  y += 20;
  const metricTexts = [
    `Itens avaliados: ${report.summary.concluido}/${report.summary.total}`,
    `Conformidade: ${report.summary.conformidade}%`,
    `OK: ${report.summary.ok}`,
    `Atenção: ${report.summary.warn}`,
    `Crítico: ${report.summary.crit}`,
    `Impressoras avaliadas: ${report.summary.impressorasAvaliadas}`
  ];
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  metricTexts.forEach(text => { doc.text(text, 40, y); y += 14; });
  y += 10;

  const groups = {};
  SECTIONS.forEach((sec, si) => {
    groups[sec.title] = sec.items.map((item, ii) => {
      const st = State.items[`${si}-${ii}`];
      return { item, status: st?.status || 'pending', qty: st?.qty || '', obs: st?.obs || '' };
    });
  });

  Object.entries(groups).forEach(([sectionTitle, items]) => {
    if (y > pageHeight - 90) { doc.addPage(); addPdfHeader(doc, report); y = 124; }
    doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(30,41,69);
    doc.text(sectionTitle, 40, y); y += 14;
    doc.setDrawColor(220,224,232); doc.line(40, y, pageWidth - 40, y); y += 10;

    items.forEach(itemData => {
      if (y > pageHeight - 82) { doc.addPage(); addPdfHeader(doc, report); y = 124; }
      const pending = itemData.status === 'pending' || !itemData.status;
      const statusLabel = pending ? 'PENDENTE' : itemData.status === 'ok' ? 'OK' : itemData.status === 'warn' ? 'ATENÇÃO' : itemData.status === 'crit' ? 'CRÍTICO' : 'N/A';
      const statusColor = pending ? [107,114,128] : itemData.status === 'ok' ? [22,163,74] : itemData.status === 'warn' ? [217,119,6] : itemData.status === 'crit' ? [220,38,38] : [107,114,128];
      doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(...statusColor); doc.text(statusLabel, 40, y);
      doc.setTextColor(15,23,42); doc.setFont('helvetica','normal'); doc.setFontSize(9);
      const titleText = `${itemData.item}${itemData.qty ? ` · Qtd: ${itemData.qty}` : ''}`;
      const lines = doc.splitTextToSize(titleText, 435); doc.text(lines, 112, y); y += Math.max(11, lines.length * 11);
      if (itemData.obs) {
        const obsLines = doc.splitTextToSize(`Observação: ${itemData.obs}`, 435);
        doc.setFontSize(8); doc.setTextColor(80,89,110); doc.text(obsLines, 112, y); y += Math.max(10, obsLines.length * 10);
      }
      y += 4;
    });
    y += 8;
  });

  if (report.printers.length) {
    if (y > pageHeight - 130) { doc.addPage(); addPdfHeader(doc, report); y = 124; }
    doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(30,41,69);
    doc.text('Vistoria de Impressoras', 40, y); y += 14;
    doc.setDrawColor(220,224,232); doc.line(40, y, pageWidth - 40, y); y += 10;
    report.printers.forEach(printer => {
      if (y > pageHeight - 82) { doc.addPage(); addPdfHeader(doc, report); y = 124; }
      const status = printer.status || 'pending';
      const label = status === 'ok' ? 'OK' : status === 'warn' ? 'ATENÇÃO' : status === 'crit' ? 'CRÍTICO' : 'PENDENTE';
      const color = status === 'ok' ? [22,163,74] : status === 'warn' ? [217,119,6] : status === 'crit' ? [220,38,38] : [107,114,128];
      doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(...color); doc.text(label, 40, y);
      doc.setTextColor(15,23,42); doc.setFont('helvetica','bold'); doc.setFontSize(9);
      const line = `S/N ${printer.serie || 'não informado'} — ${printer.modelo || 'modelo não informado'}${printer.departamento ? ` — ${printer.departamento}` : ''}`;
      doc.text(doc.splitTextToSize(line, 435), 112, y);
      y += 12;
      if (printer.observacao) {
        doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(80,89,110);
        const obsLines = doc.splitTextToSize(`Observação: ${printer.observacao}`, 435);
        doc.text(obsLines, 112, y); y += Math.max(10, obsLines.length * 10);
      }
      y += 4;
    });
  }

  if (selectedEmailAttachments.length) {
    const imageAttachments = selectedEmailAttachments.filter(item => (item.type || '').startsWith('image/'));
    if (imageAttachments.length) {
      if (y > pageHeight - 180) { doc.addPage(); addPdfHeader(doc, report); y = 124; }
      doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(30,41,69);
      doc.text('Imagens anexadas', 40, y); y += 18;
      imageAttachments.forEach(item => {
        if (y > pageHeight - 190) { doc.addPage(); addPdfHeader(doc, report); y = 124; }
        doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(15,23,42);
        doc.text(item.name, 40, y); y += 8;
        try {
          const type = item.type.includes('png') ? 'PNG' : 'JPEG';
          const dims = item.aspect || { w: 160, h: 105 };
          const maxW = 220, maxH = 135;
          const ratio = Math.min(maxW / dims.w, maxH / dims.h, 1);
          doc.addImage(item.dataUrl, type, 40, y, dims.w * ratio, dims.h * ratio);
          y += dims.h * ratio + 18;
        } catch (e) { doc.text('Imagem não pôde ser incluída.', 40, y + 14); y += 30; }
      });
    }
  }

  const pageCount = doc.internal.getNumberOfPages();
  for (let i=1;i<=pageCount;i++) {
    doc.setPage(i);
    doc.setDrawColor(230,232,236); doc.line(40, pageHeight - 42, pageWidth - 40, pageHeight - 42);
    doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(93,103,120);
    doc.text(`Tenda Atacado · Checklist TI · Gerado em ${report.summary.geradoEm}`, 40, pageHeight - 26);
    doc.text(`Página ${i}/${pageCount}`, pageWidth - 78, pageHeight - 26);
  }

  return doc.output('datauristring');
}

async function sendEmailReport() {
  if (!OperationLock.acquire('email')) return;
  const recipientsInput = document.getElementById('emailRecipients');
  const subjectInput = document.getElementById('emailSubject');
  const bodyInput = document.getElementById('emailBody');
  const autoInput = document.getElementById('emailAutoSend');
  const recipients = (recipientsInput.value || '').split(/[,;]+/).map(v => v.trim()).filter(Boolean);
  const subject = subjectInput.value || 'Checklist TI';
  const body = bodyInput.value || 'Segue o relatório do checklist TI.';

  if (!recipients.length) {
    showToast('Informe ao menos um destinatário.', 'error');
    return;
  }
  if (recipients.some(v => !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v))) {
    showToast('Revise os endereços de e-mail informados.', 'error');
    return;
  }

  const btn = document.getElementById('emailSendBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Enviando...'; }

  try {
    const dataUri = buildPdfReport();
    const attachments = selectedEmailAttachments.map(item => ({
      name: item.name,
      mimeType: item.type || 'application/octet-stream',
      base64: String(item.dataUrl || '').split(',')[1] || ''
    })).filter(item => item.base64);

    const payload = {
      action: 'sendEmailPdf',
      to: recipients,
      subject,
      body,
      pdfName: `${getReportFilename('checklist')}.pdf`,
      pdfBase64: dataUri.split(',')[1],
      summary: buildEmailReportData().summary,
      checklist: buildPayload(),
      attachments,
      sentBy: State.user.email || '',
      powerAutomateUrl: getBackendUrl()
    };

    const submission = persistSavedSubmission(buildPayload(), 'Enviando...');
    await postBackend(payload);

    updateSavedSubmission(submission.id, { status: 'Enviado' });
    const history = loadEmailHistory();
    history.unshift({
      to: recipients.join(', '),
      subject,
      timestamp: new Date().toLocaleString('pt-BR')
    });
    saveEmailHistory(history.slice(0, 12));
    renderEmailHistory();
    localStorage.setItem(EMAIL_AUTO_KEY, autoInput.checked ? '1' : '0');
    showToast('E-mail enviado com PDF e anexos.', 'success');
    closeModal('emailModal');
  } catch (e) {
    console.error(e);
    try { enqueuePendingSave({ action: 'sendEmailPdf', to: recipients, subject, body, pdfName: `${getReportFilename('checklist')}.pdf`, pdfBase64: buildPdfReport().split(',')[1], summary: buildEmailReportData().summary, checklist: buildPayload(), attachments: selectedEmailAttachments.map(item => ({ name: item.name, mimeType: item.type || 'application/octet-stream', base64: String(item.dataUrl || '').split(',')[1] || '' })).filter(item => item.base64), sentBy: State.user.email || '' }); } catch (_) {}
    showToast('Envio não concluído. O e-mail ficou em pendências para nova tentativa.', 'error');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Enviar por E-mail'; }
    OperationLock.release('email');
  }
}

function buildChecklistWorkbook(payload) {
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet([buildSpreadsheetHeaders(), ...buildChecklistRows(payload)]);
  ws['!cols'] = [12,12,24,18,22,48,12,14,55,12,10,14,20].map(w => ({ wch: w }));
  XLSX.utils.book_append_sheet(wb, ws, 'Checklist');

  const printerData = [buildPrinterSheetHeaders(), ...buildPrinterRowsForSheet()];
  const printerWs = XLSX.utils.aoa_to_sheet(printerData);
  printerWs['!cols'] = [12,12,24,18,20,25,22,22,14,12,55,12].map(w => ({ wch: w }));
  XLSX.utils.book_append_sheet(wb, printerWs, 'Impressoras');
  return wb;
}

function buildChecklistExcelBase64(payload) {
  const wb = buildChecklistWorkbook(payload);
  return XLSX.write(wb, { bookType: 'xlsx', type: 'base64' });
}

/* SAVE TO POWER AUTOMATE / EXCEL */
function buildPayload() {
  const loja = document.getElementById('fLoja').value;
  const data = document.getElementById('fData').value;
  const resp = document.getElementById('fResp').value;
  const reg  = document.getElementById('fReg').value;
  const itens = [];
  const progresso = `${State.doneItems()}/${State.totalItems()}`;
  const score = State.overallScore();
  const salvoEm = new Date().toLocaleString('pt-BR');

  SECTIONS.forEach((sec, si) => {
    sec.items.forEach((item, ii) => {
      const st = State.items[`${si}-${ii}`];
      if (!st || !st.status) return;
      itens.push({
        loja: loja || '', data: data || '', responsavel: resp || '', regional: reg || '',
        secao: sec.title, item,
        status: st.status || '', quantidade: st.qty || '', observacao: st.obs || '',
        horario: st.ts ? new Date(st.ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : '',
        score, progresso, salvoEm
      });
    });
  });

  const impressoras = buildPrinterExportRows();

  return { itens, impressoras, score, progresso, salvoEm };
}


const OperationLock = (() => {
  const active = new Set();
  return {
    acquire(key) { if (active.has(key)) return false; active.add(key); return true; },
    release(key) { active.delete(key); },
    has(key) { return active.has(key); }
  };
})();

async function doSave() {
  if (!OperationLock.acquire('save')) return;
  const btn = document.getElementById('saveBtn');
  if (!btn) { OperationLock.release('save'); return; }
  const original = btn.innerHTML;
  btn.classList.add('loading');
  btn.innerHTML = `<svg class="save-btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="animation:spin 0.8s linear infinite"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg> Salvando...`;

  const payload = buildPayload();
  localStorage.setItem('checklist-data', JSON.stringify(payload));
  persistSavedSubmission(payload, 'Salvo localmente');
  autoSave();
  autoSavePrinters();

  if (!payload.itens.length && !payload.impressoras.length) {
    showToast('Nenhum item ou impressora preenchido para salvar.', 'error');
    btn.classList.remove('loading'); btn.innerHTML = original; OperationLock.release('save'); return;
  }

  const request = {
    action: 'saveChecklist',
    sheetName: 'Checklist TI Lojas',
    headers: buildSpreadsheetHeaders(),
    rows: buildChecklistRows(payload),
    printerSheetName: 'Impressoras',
    printerHeaders: buildPrinterSheetHeaders(),
    printerRows: buildPrinterRowsForSheet(),
    itens: payload.itens,
    impressoras: payload.impressoras,
    summary: buildEmailReportData().summary,
    savedBy: State.user.email || ''
  };

  try {
    showToast('Sincronizando com a planilha...', 'info');
    await postBackend(request);
    localStorage.removeItem('checklist-draft');
    showToast(`Vistoria sincronizada: ${payload.itens.length} itens + ${payload.impressoras.length} impressora(s).`, 'success');
    maybeAutoSendEmailFromSave();
  } catch (e) {
    enqueuePendingSave(request);
    showToast('Sem conexão com o servidor. Dados salvos localmente e colocados na fila de sincronização.', 'error');
  } finally {
    btn.classList.remove('loading'); btn.innerHTML = original;
    OperationLock.release('save');
  }
}

/* AUTO SAVE (DRAFT) */
const autoSave = debounce(() => {
  try {
    const stateSnapshot = {};
    for (const key in State.items) {
      const s = State.items[key];
      stateSnapshot[key] = {status:s.status ?? null, qty:s.qty ?? '', obs:s.obs ?? '', ts:s.ts ?? null};
    }
    localStorage.setItem('checklist-draft', JSON.stringify({
      state: stateSnapshot,
      loja: document.getElementById('fLoja')?.value || '',
      data: document.getElementById('fData')?.value || '',
      resp: document.getElementById('fResp')?.value || '',
      reg: document.getElementById('fReg')?.value || '',
      savedAt: new Date().toISOString()
    }));
  } catch(e) {}
}, 900);

function restoreSession() {
  try {
    const raw = localStorage.getItem('checklist-draft');
    if (!raw) return;
    const draft = JSON.parse(raw);

    if (draft.loja) document.getElementById('fLoja').value = draft.loja;
    if (draft.data) document.getElementById('fData').value = draft.data;
    if (draft.resp) document.getElementById('fResp').value = draft.resp;
    if (draft.reg)  document.getElementById('fReg').value  = draft.reg;

    Object.keys(draft.state).forEach(key => {
      if (!State.items[key]) return;
      const s = draft.state[key];
      State.items[key] = s;

      const card = document.getElementById(`card-${key}`);
      if (!card) return;

      card.className = 'item-card';
      card.querySelectorAll('.status-btn').forEach(b => b.classList.remove('sel'));

      if (s.status) {
        const btn = card.querySelector(`[data-s="${s.status}"]`);
        if (btn) btn.classList.add('sel');
        card.classList.add(`has-${s.status}`);
        const det = document.getElementById(`det-${key}`);
        if (det) det.classList.add('open');
      }

      const qty = document.getElementById(`qty-${key}`);
      const obs = document.getElementById(`obs-${key}`);
      if (qty) qty.value = s.qty || '';
      if (obs) obs.value = s.obs || '';

      const tsEl = document.getElementById(`ts-${key}`);
      if (tsEl && s.ts) {
        const d = new Date(s.ts);
        tsEl.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>${d.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'})}`;
      }
    });

    updateProgress();
    updateTabBadges();
    renderPrintersForSelectedStore();
    document.getElementById('resumeBanner').classList.remove('show');
    showToast('Checklist restaurado!', 'success');
  } catch(e) {
    showToast('Erro ao restaurar. Iniciando novo.', 'error');
    dismissResume();
  }
}

  localStorage.removeItem('checklist-draft');
  document.getElementById('resumeBanner').classList.remove('show');
}

function adminSaveSection() {
  const titleEl = document.getElementById('adminNewSectionTitle');
  const itemsEl = document.getElementById('adminNewSectionItems');
  const title = (titleEl.value || '').trim();
  const items = (itemsEl.value || '').split('\n').map(s => s.trim()).filter(Boolean);

  if (!title) { showToast('Digite um nome para a seção', 'error'); return; }
  if (!items.length) { showToast('Adicione pelo menos um item', 'error'); return; }

  if (adminEditIndex !== null) {
    // Editando seção existente: mantém o id, atualiza título e itens
    const sec = SECTIONS[adminEditIndex];
    if (!confirm(`Salvar alterações em "${sec.title}"? O progresso da vistoria atual será reiniciado.`)) return;
    sec.title = title;
    sec.items = items;
    saveSections();
    adminCancelEdit();
    renderAdminSectionsList();
    rebuildApp();
    showToast(`Seção "${title}" atualizada`, 'success');
    return;
  }

  const id = title.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || `sec-${Date.now()}`;
  SECTIONS.push({ id, title, items });
  saveSections();

  titleEl.value = '';
  itemsEl.value = '';
  renderAdminSectionsList();
  rebuildApp();
  showToast(`Seção "${title}" adicionada`, 'success');
}

function adminDeleteSection(si) {
  const sec = SECTIONS[si];
  if (!sec) return;
  if (!confirm(`Excluir a seção "${sec.title}"? O progresso da vistoria atual será reiniciado.`)) return;

  SECTIONS.splice(si, 1);
  saveSections();

/* LOGIN / LOGOUT (Microsoft / Entra ID via MSAL) */
function doMsLogin() {
  const errEl = document.getElementById('loginError');
  const btn   = document.getElementById('loginBtn');
  errEl.textContent = '';

  if (!isMsalConfigured()) {
    errEl.textContent = 'Login Microsoft ainda não configurado. Veja as instruções no código (CLIENT_ID / TENANT_ID).';
    return;
  }

  const pca = getMsalInstance();
  if (!pca) {
    console.error('[MSAL] Biblioteca não carregada. typeof msal =', typeof msal, '| isMsalConfigured =', isMsalConfigured());
    errEl.textContent = 'Não foi possível carregar a biblioteca de login da Microsoft (msal.js). Recarregue a página (puxe para atualizar) e tente de novo. Se persistir, pode ser bloqueio de rede/extensão do navegador.';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Conectando…';

  pca.loginRedirect({
    scopes: ["User.Read"],
    prompt: "select_account"
  }).catch(err => {
    btn.disabled = false;
    btn.innerHTML = 'Entrar com Microsoft';
    errEl.textContent = 'Não foi possível iniciar o login: ' + (err?.errorMessage || err?.message || 'erro desconhecido.');
  });
}

function applyMsAccount(account) {
  const email = (account.username || '').toLowerCase();
  const name  = account.name || email.split('@')[0];

  // Restringe aos domínios corporativos permitidos (ver MSAL_CONFIG.allowedDomains)
  const domains = MSAL_CONFIG.allowedDomains || [];
  const isAllowed = domains.length === 0 || domains.some(d => email.endsWith('@' + d.toLowerCase()));
  if (!isAllowed) {
    const errEl = document.getElementById('loginError');
    if (errEl) errEl.textContent = `Acesso restrito a contas @${domains.join(' ou @')}. Você entrou com ${email}.`;
    getMsalInstance()?.logoutRedirect({ postLogoutRedirectUri: MSAL_CONFIG.redirectUri });
    return false;
  }

  State.user = { email, name, isAdmin: isAdminEmail(email) };
  sessionStorage.setItem('ti-user', JSON.stringify(State.user));
  document.getElementById('loginPage').classList.add('hidden');
  openApp();
  return true;
}

function openApp() {
  const app = document.getElementById('app');
  app.style.display = 'flex';
  if (window.MotionFX) MotionFX.enterApp();
  requestAnimationFrame(() => app.classList.add('visible'));

  document.getElementById('brandUser').textContent = State.user.email;
  updateAdminUI();

  const nameVal = State.user.name || State.user.email.split('@')[0].replace(/\./g, ' ');
  const respEl  = document.getElementById('fResp');
  if (respEl && !respEl.value) {
    respEl.value = nameVal.replace(/\b\w/g, c => c.toUpperCase());
  }

  // Check for draft
  try {
    const raw = localStorage.getItem('checklist-draft');
    if (raw) {
      const draft = JSON.parse(raw);
      const d = new Date(draft.savedAt);
      const diffH = (Date.now() - d.getTime()) / 3600000;
      if (diffH < 24 && draft.loja) {
        const banner = document.getElementById('resumeBanner');
        const textEl = document.getElementById('resumeText');
        const time   = d.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'});
        textEl.textContent = `Checklist em andamento: ${draft.loja} · ${time}`;
        banner.classList.add('show');
      }
    }
  } catch(e) {}
}

function doLogout() {

}

}

/* UTILITIES */
function debounce(fn, delay) {
  let timer;
  return function(...args) {
    clearTimeout(timer);
    timer = setTimeout(() => fn.apply(this, args), delay);
  };
}

(function boot() {
  // Set today's date
  const dateEl = document.getElementById('fData');
  if (dateEl) dateEl.value = new Date().toISOString().split('T')[0];

  // App é somente tema escuro — limpa preferência antiga de modo claro

  // URL do fluxo é fixa (DEFAULT_URL) — não há mais override por dispositivo

  // Build UI
  if (window.SplashFX) SplashFX.step(24, 'Preparando o checklist…');
  restorePrintersDraft();
  buildUI();
  if (window.SplashFX) SplashFX.step(52, 'Carregando impressoras…');
  Promise.resolve(loadPrintersCatalog()).catch(function(){}).then(function(){
    if (window.SplashFX) SplashFX.step(76, 'Verificando sessão…');
  });

  function finishBoot() {
    if (window.SplashFX && !finishBoot._go) { finishBoot._go = true; SplashFX.done(finishBoot); return; }
    const splash = document.getElementById('splash');
    splash.classList.add('hidden');

    // 1) Sessão já aberta nesta aba (sessionStorage)
    const saved = sessionStorage.getItem('ti-user');
    if (saved) {
      try {
        State.user = JSON.parse(saved);
        document.getElementById('loginPage').classList.add('hidden');
        openApp();
        return;
      } catch(e) { /* cai para verificar conta MSAL */ }
    }

    // 2) Conta Microsoft já autenticada no navegador (cache do MSAL)
    const pca = getMsalInstance();
    if (pca) {
      const accounts = pca.getAllAccounts();
      if (accounts.length > 0) {
        if (applyMsAccount(accounts[0])) return;
      }
    }

    showLoginPage();
  }

  function showLoginPage() {
    const lp = document.getElementById('loginPage');
    lp.classList.remove('hidden');
  }

  // Aguarda o MSAL processar o retorno do login (loginRedirect) antes de
  // decidir se mostra a tela de login ou já abre o app.
  {
    const pca = getMsalInstance();
    if (pca) {
      pca.handleRedirectPromise()
        .then(response => {
          if (response?.account) applyMsAccount(response.account);
        })
        .catch(err => {
          const errEl = document.getElementById('loginError');
          if (errEl) errEl.textContent = 'Falha no login Microsoft: ' + (err?.errorMessage || err?.message || 'erro desconhecido.');
        })
        .finally(finishBoot);
    } else {
      finishBoot();
    }
  }
})();
</script>
<script id="ultra-features">
(function(){
  'use strict';

  const undoStack=[], redoStack=[];
  function snap(){
    const o={}; for(const k in State.items) o[k]={...State.items[k]}; return JSON.stringify(o);
  }
  function restore(raw){
    try{
      State.items=JSON.parse(raw);
      if(typeof renderAll==='function') renderAll();
      else if(typeof render==='function') render();
      if(typeof updateDashboard==='function') updateDashboard();
      if(typeof autoSave==='function') autoSave();
    }catch(e){}
  }
  window.checklistHistory={
    checkpoint(){
      const s=snap();
      if(undoStack[undoStack.length-1]!==s){
        undoStack.push(s); if(undoStack.length>40) undoStack.shift(); redoStack.length=0;
      }
    },
    undo(){
      if(undoStack.length<2)return;
      redoStack.push(undoStack.pop()); restore(undoStack[undoStack.length-1]);
    },
    redo(){
      if(!redoStack.length)return;
      const s=redoStack.pop(); undoStack.push(s); restore(s);
    }
  };

  window.filterChecklist=function(q){
    q=String(q||'').trim().toLocaleLowerCase('pt-BR');
    document.querySelectorAll('.item-card').forEach(card=>{
      card.hidden=!!q && !card.textContent.toLocaleLowerCase('pt-BR').includes(q);
    });
  };

  window.downloadChecklistBackup=function(){
    try{
      const payload={
        version:1,
        exportedAt:new Date().toISOString(),
        form:{
          loja:document.getElementById('fLoja')?.value||'',
          data:document.getElementById('fData')?.value||'',
          responsavel:document.getElementById('fResp')?.value||'',
          regional:document.getElementById('fReg')?.value||''
        },
        items:State.items
      };
      const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
      const url=URL.createObjectURL(blob), a=document.createElement('a');
      a.href=url; a.download=`checklist-backup-${Date.now()}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
      if(typeof showToast==='function')showToast('Backup criado com sucesso!','success');
    }catch(e){ if(typeof showToast==='function')showToast('Não foi possível criar o backup.','error'); }
  };

  try{
    if((navigator.hardwareConcurrency && navigator.hardwareConcurrency<=4) ||
       matchMedia('(prefers-reduced-motion: reduce)').matches)
      document.documentElement.classList.add('performance-mode');
  }catch(e){}

  document.addEventListener('keydown',e=>{
    const typing=/INPUT|TEXTAREA|SELECT/.test(e.target?.tagName);
    if((e.ctrlKey||e.metaKey)&&!typing&&e.key.toLowerCase()==='z'){
      e.preventDefault(); checklistHistory.undo();
    }else if((e.ctrlKey||e.metaKey)&&!typing&&e.key.toLowerCase()==='y'){
      e.preventDefault(); checklistHistory.redo();
    }
  },{passive:false});
})();
</script>
<script>
/* Funções de campo: densidade, tela ligada e tempo de visita */
let _wake=null;
function setDensity(on){document.body.classList.toggle('compact',on);try{localStorage.setItem('ti-density',on?'1':'0')}catch(e){}}
async function setWake(on){try{if(on&&navigator.wakeLock){_wake=await navigator.wakeLock.request('screen')}else if(_wake){await _wake.release();_wake=null}localStorage.setItem('ti-wake',on?'1':'0')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&localStorage.getItem('ti-wake')==='1')setWake(true)});
window.addEventListener('load',()=>{
  const d=localStorage.getItem('ti-density')==='1',w=localStorage.getItem('ti-wake')==='1';
  setTimeout(()=>{const a=document.getElementById('densityToggle'),b=document.getElementById('wakeToggle');if(a)a.checked=d;if(b)b.checked=w;if(d)setDensity(true);if(w)setWake(true);
    const info=document.querySelector('.brand-info');if(info){const t=document.createElement('div');t.className='visit-timer';info.appendChild(t);
      let st=+localStorage.getItem('ti-visit-start')||0;if(!st||Date.now()-st>864e5){st=Date.now();localStorage.setItem('ti-visit-start',st)}
      const tick=()=>{const m=Math.floor((Date.now()-st)/6e4);t.textContent='Visita: '+Math.floor(m/60)+'h'+String(m%60).padStart(2,'0')};tick();setInterval(tick,3e4)}},400)});
</script>

<script id="apple-dark-mode-js">
(function(){
  const KEY='checklist-apple-theme';
  function applyTheme(theme){
    const dark=theme==='dark';
    document.documentElement.classList.toggle('apple-dark',dark);
    document.documentElement.classList.toggle('apple-light',!dark);
    document.body.classList.toggle('apple-dark',dark);
    document.body.classList.toggle('apple-light',!dark);
    const btn=document.getElementById('themeToggle');
    if(btn){
      btn.title=dark?'Modo claro':'Modo escuro';
      btn.setAttribute('aria-label',dark?'Ativar modo claro':'Ativar modo escuro');
      const sun=btn.querySelector('.theme-sun'), moon=btn.querySelector('.theme-moon');
      if(sun) sun.style.display=dark?'none':'block';
      if(moon) moon.style.display=dark?'block':'none';
    }
    const meta=document.getElementById('themeColorMeta');
    if(meta) meta.setAttribute('content',dark?'#000000':'#f5f5f7');
  }
  window.toggleAppleTheme=function(){
    const next=document.body.classList.contains('apple-dark')?'light':'dark';
    try{localStorage.setItem(KEY,next);}catch(e){}
    applyTheme(next);
  };
  function init(){
    let saved=null;
    try{saved=localStorage.getItem(KEY);}catch(e){}
    if(saved!=='dark' && saved!=='light'){
      saved=window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
    }
    applyTheme(saved);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init);
  else init();
})();
</script>

    <div class="pwa-banner-title">Instalar Inspector TI</div>
    <div class="pwa-banner-sub">Acesse offline, como app nativo</div>
  </div>
  <button class="pwa-install-btn" id="pwaInstallBtn">Instalar</button>
  <button class="pwa-dismiss-btn" onclick="dismissPWA()">x</button>
</div>

<script>
/* ENHANCED MODULE — PWA, OFFLINE, HAPTICS, ADVANCED UX */

/* PWA / INSTALL PROMPT */
let deferredInstallPrompt = null;

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstallPrompt = e;
  const dismissed = localStorage.getItem('pwa-dismissed');
  if (!dismissed) {
    setTimeout(() => {
      document.getElementById('pwaBanner').classList.add('show');
    }, 4000);
  }
});

document.getElementById('pwaInstallBtn').addEventListener('click', async () => {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  const { outcome } = await deferredInstallPrompt.userChoice;
  if (outcome === 'accepted') {
    showToast('App instalado com sucesso!', 'success');
  }
  deferredInstallPrompt = null;
  document.getElementById('pwaBanner').classList.remove('show');
});

function dismissPWA() {
  document.getElementById('pwaBanner').classList.remove('show');
  localStorage.setItem('pwa-dismissed', '1');
}

window.addEventListener('appinstalled', () => {
  document.getElementById('pwaBanner').classList.remove('show');
  showToast('Aplicativo instalado', 'success');
});

/* OFFLINE DETECTION */
function updateOnlineStatus() {
  const bar = document.getElementById('offlineBar');
  if (bar) bar.classList.toggle('show', !navigator.onLine);
  if (!navigator.onLine) {
    showToast('Modo offline ativo — dados salvos localmente', 'info');
  }
}

window.addEventListener('online',  updateOnlineStatus);
window.addEventListener('online',  () => setTimeout(() => retryPendingSaves(), 1200));
window.addEventListener('offline', updateOnlineStatus);
updateOnlineStatus();

/* SERVICE WORKER REGISTRATION */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.warn('SW:', err));
  });
}

/* HAPTIC FEEDBACK */
function haptic(style = 'light') {
  if ('vibrate' in navigator) {
    const patterns = { light: [10], medium: [20], heavy: [30, 10, 30], success: [10, 50, 10] };
    navigator.vibrate(patterns[style] || patterns.light);
  }
}

/* Enhance status buttons with haptics */
document.addEventListener('click', e => {
  const btn = e.target.closest('.status-btn');
  if (!btn) return;
  const s = btn.dataset.s;
  if (s === 'crit') haptic('heavy');
  else if (s === 'warn') haptic('medium');
  else haptic('light');
  btn.classList.add('haptic');
  setTimeout(() => btn.classList.remove('haptic'), 400);
});

/* QUANTITY STEPPERS */
function upgradeQtyInputs() {
  document.querySelectorAll('.qty-input').forEach(input => {
    if (input.dataset.upgraded) return;
    input.dataset.upgraded = '1';

    const wrap = document.createElement('div');
    wrap.className = 'qty-stepper';
    input.parentNode.insertBefore(wrap, input);

    const dec = document.createElement('button');
    dec.className = 'qty-stepper-btn';
    dec.type = 'button';
    dec.textContent = '−';
    dec.addEventListener('click', () => {
      const cur = parseInt(input.value) || 0;
      if (cur > 0) { input.value = cur - 1; input.dispatchEvent(new Event('input')); haptic('light'); }
    });

    const inc = document.createElement('button');
    inc.className = 'qty-stepper-btn';
    inc.type = 'button';
    inc.textContent = '+';
    inc.addEventListener('click', () => {
      const cur = parseInt(input.value) || 0;
      input.value = cur + 1; input.dispatchEvent(new Event('input')); haptic('light');
    });

    wrap.appendChild(dec);
    wrap.appendChild(input);
    wrap.appendChild(inc);
  });
}

/* Call after a brief delay to let DOM settle */
setTimeout(upgradeQtyInputs, 500);

/* SCROLL-TO-TOP FAB */
const fabHtml = `<button class="fab-top" id="fabTop" onclick="scrollToTop()" aria-label="Voltar ao topo">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
</button>`;
document.querySelector('.slides-viewport').insertAdjacentHTML('beforeend', fabHtml);

let fabTicking = false;
document.getElementById('slidesTrack').addEventListener('scroll', e => {
  if (fabTicking) return;
  fabTicking = true;
  const scrollTop = e.target.scrollTop;
  requestAnimationFrame(() => {
    const fab = document.getElementById('fabTop');
    if (fab) fab.classList.toggle('visible', scrollTop > 200);
    fabTicking = false;
  });
}, { passive: true, capture: true });

function scrollToTop() {
  const activeSlide = document.querySelector('.slides-track > *:not(.slide-dashboard)');
  if (activeSlide) activeSlide.scrollTo({ top: 0, behavior: 'smooth' });
  haptic('light');
}

/* Smart auto-scroll: only when the changed card is outside the viewport. */
const origHandle = handleStatusClick;
window.handleStatusClick = function(key, status) {
  origHandle(key, status);
  requestAnimationFrame(() => {
    const card = document.getElementById(`card-${key}`);
    const vp = document.querySelector('.slides-viewport');
    if (!card || !vp) return;
    const r = card.getBoundingClientRect(), v = vp.getBoundingClientRect();
    if (r.top < v.top || r.bottom > v.bottom) card.scrollIntoView({behavior:'auto', block:'nearest'});
  });
};

/* COMPLETION CELEBRATION */
let wasComplete = false;
function checkCompletion() {
  const done  = State.doneItems();
  const total = State.totalItems();
  const isNow = done === total && total > 0;
  if (isNow && !wasComplete) {
    wasComplete = true;
    haptic('success');
    showToast('Vistoria 100% concluída! Salve o relatório.', 'success');
    const scoreCard = document.getElementById('dashScoreCard');
    if (scoreCard) scoreCard.classList.add('completion-pulse');
    setTimeout(() => scoreCard && scoreCard.classList.remove('completion-pulse'), 600);
  } else if (!isNow) {
    wasComplete = false;
  }
}

/* Patch updateProgress to also check completion */
const origUpdateProgress = updateProgress;
window.updateProgress = function() {
  origUpdateProgress();
  checkCompletion();
};

/* Performance: render cards immediately; no simultaneous stagger animations. */
const origGoToTab = goToTab;
window.goToTab = function(si) {
  origGoToTab(si);
  if (si === -1 && typeof updateDashboard === 'function') updateDashboard();
};

/* KEYBOARD SHORTCUT HINTS */
if (!('ontouchstart' in window)) {
  /* Desktop: show keyboard shortcuts tooltip */
  const hint = document.createElement('div');
  hint.style.cssText = 'position:fixed;bottom:68px;right:16px;font-size:10px;color:var(--text-muted);background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:6px 10px;z-index:50;opacity:0;transition:opacity 0.2s;pointer-events:none;';
  hint.innerHTML = '⌘K buscar &nbsp;·&nbsp; ⌘S salvar &nbsp;·&nbsp; ESC fechar';
  document.body.appendChild(hint);
  setTimeout(() => { hint.style.opacity = '0.7'; }, 3000);
  setTimeout(() => { hint.style.opacity = '0'; }, 7000);
}


/* LONG-PRESS QUICK NOTE ON ITEM */
let pressTimer = null;
document.addEventListener('touchstart', e => {
  const card = e.target.closest('.item-card');
  if (!card) return;
  pressTimer = setTimeout(() => {
    haptic('medium');
    const key = card.id.replace('card-', '');
    const obs  = document.getElementById(`obs-${key}`);
    if (obs) {
      const det = document.getElementById(`det-${key}`);
      if (det && !det.classList.contains('open')) {
        det.classList.add('open');
      }
      obs.focus();
    }
  }, 500);
}, { passive: true });
document.addEventListener('touchend',   () => clearTimeout(pressTimer), { passive: true });
document.addEventListener('touchmove',  () => clearTimeout(pressTimer), { passive: true });
document.addEventListener('touchcancel',() => clearTimeout(pressTimer), { passive: true });

/* SMART DATE */
(function updateClock() {
  const now = new Date();
  const h   = now.getHours();
  const greet = h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
  const user = document.getElementById('brandUser');
  if (user && State.user.name) {
    const name = State.user.name.split(' ')[0];
    user.innerHTML = `${greet}, ${name}`;
  }
})();

/* DYNAMIC SCORE COLOR */
function updateScoreColor() {
  const score = State.overallScore();
  const fill = document.getElementById('progressFill');
  if (!fill) return;
  if (score >= 80) fill.style.background = '#2A5FAF';
  else if (score >= 60) fill.style.background = '#2A5FAF';
  else if (score > 0) fill.style.background = '#2A5FAF';
  else fill.style.background = '';
}

/* Patch updateProgress to also update score color */
const _origUpdateProgress = updateProgress;
window.updateProgress = function() {
  _origUpdateProgress();
  updateScoreColor();
};

/* VISIBILITY CHANGE — RESTORE IF NEEDED */
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) {
    const dateEl = document.getElementById('fData');
    if (dateEl && !dateEl.value) {
      dateEl.value = new Date().toISOString().split('T')[0];
    }
  }
});

/* ACCESSIBILITY: FOCUS TRAP IN MODALS */
document.querySelectorAll('.modal-backdrop').forEach(backdrop => {
  backdrop.addEventListener('keydown', e => {
    if (e.key !== 'Tab') return;
    const sheet = backdrop.querySelector('.modal-sheet');
    if (!sheet) return;
    const focusable = [...sheet.querySelectorAll('button, input, textarea, select, [tabindex="0"]')].filter(el => !el.disabled);
    if (!focusable.length) return;
    const first = focusable[0], last = focusable[focusable.length - 1];
    if (e.shiftKey ? document.activeElement === first : document.activeElement === last) {
      e.preventDefault();
      (e.shiftKey ? last : first).focus();
    }
  });
});

/* COPY SHARE */
window.shareReport = async function() {
  const loja = document.getElementById('fLoja').value || 'Loja';
  const score = State.overallScore();
  if (navigator.share) {
    try {
      await navigator.share({
        title: `Vistoria TI — ${loja}`,
        text: `Score: ${score}/100 | ${State.doneItems()}/${State.totalItems()} itens avaliados`,
      });
    } catch(e) {}
  } else {
    copyReport();
  }
};

</script>
<script id="motion-fx-js">
/* Animações da interface: entrada do app, troca de aba, números, toque e "processando" */
(function(){
  'use strict';
  var root=document.documentElement, FX=root.classList.contains('fx');
  function lite(){return root.classList.contains('performance-mode');}

  function tagStagger(c,max){
    var k=c.children;
    for(var i=0;i<k.length&&i<max;i++){k[i].style.setProperty('--i',i);k[i].classList.add('fx-s');}
  }

  /* ----- entrada do app ----- */
  function enterApp(){
    if(!FX) return;
    var app=document.getElementById('app'); if(!app) return;
    var dash=app.querySelector('.slide-dashboard');
    if(dash&&!lite()) tagStagger(dash,6);
    app.classList.remove('fx-enter'); void app.offsetWidth; app.classList.add('fx-enter');
    clearTimeout(enterApp._t);
    enterApp._t=setTimeout(function(){app.classList.remove('fx-enter');},1800);
    setTimeout(function(){moveIndicator(false);},80);
  }

  /* ----- indicador deslizante das abas ----- */
  var ro=null;
  function ensureInd(){
    var tabs=document.getElementById('sectionTabs'); if(!tabs) return null;
    var ind=tabs.querySelector('.fx-tab-ind');
    if(!ind){ind=document.createElement('span');ind.className='fx-tab-ind';ind.setAttribute('aria-hidden','true');tabs.appendChild(ind);}
    if(window.ResizeObserver){
      if(!ro) ro=new ResizeObserver(function(){moveIndicator(false);});
      tabs.querySelectorAll('.tab-btn').forEach(function(b){ro.observe(b);});
    }
    return ind;
  }
  function moveIndicator(animate){
    if(!FX) return;
    var ind=ensureInd(); if(!ind) return;
    var a=document.querySelector('#sectionTabs .tab-btn.active');
    if(!a||!a.offsetWidth){ind.style.opacity='0';return;}
    if(!animate) ind.style.transition='none';
    ind.style.opacity='1';
    ind.style.transform='translateX('+a.offsetLeft+'px) scaleX('+(a.offsetWidth/100)+')';
    if(!animate){void ind.offsetWidth;ind.style.transition='';}
  }
  window.addEventListener('resize',function(){moveIndicator(false);});
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){moveIndicator(false);});

  /* ----- troca de aba ----- */
  if(typeof window.goToTab==='function'){
    var _go=window.goToTab;
    window.goToTab=function(si){
      var prev; try{prev=State.ui.currentTab;}catch(e){}
      var r=_go.apply(this,arguments);
      try{
        moveIndicator(true);
        if(FX&&prev!==si&&!lite()){
          var track=document.getElementById('slidesTrack');
          if(track&&!track.classList.contains('search-mode')){
            var slide=track.children[si===-1?0:si+1];
            if(slide){
              tagStagger(slide,8);
              slide.classList.remove('fx-in'); void slide.offsetWidth; slide.classList.add('fx-in');
              clearTimeout(slide._fxT);
              slide._fxT=setTimeout(function(){slide.classList.remove('fx-in');},900);
            }
          }
        }
      }catch(e){}
      return r;
    };
  }

  /* ----- pop ao marcar OK / Atenção / Crítico ----- */
  if(typeof window.handleStatusClick==='function'){
    var _hs=window.handleStatusClick;
    window.handleStatusClick=function(key){
      var r=_hs.apply(this,arguments);
      if(FX){try{
        var card=document.getElementById('card-'+key), b=card&&card.querySelector('.status-btn.sel');
        if(b){b.classList.remove('fx-pop');void b.offsetWidth;b.classList.add('fx-pop');setTimeout(function(){b.classList.remove('fx-pop');},450);}
      }catch(e){}}
      return r;
    };
  }

  /* ----- números do painel contando até o valor ----- */
  function runCount(el,txt){
    var m=/^(\d+)(%?)$/.exec(txt);
    el._fxTok=(el._fxTok||0)+1; var tok=el._fxTok;
    if(!m){el._fxShown=null;return;}
    var to=+m[1], suf=m[2], from=el._fxShown==null?0:el._fxShown;
    if(!FX||lite()||from===to){el._fxShown=to;return;}
    var t0=performance.now(), dur=Math.min(900,300+Math.abs(to-from)*12);
    (function step(now){
      if(tok!==el._fxTok) return;
      var p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,3), v=Math.round(from+(to-from)*e);
      el._fxShown=v; el._fxWrote=v+suf; el.textContent=el._fxWrote;
      if(p<1) requestAnimationFrame(step);
    })(t0);
  }
  ['dashScore','dOk','dWarn','dCrit','dNa','dashProgressPct'].forEach(function(id){
    var el=document.getElementById(id); if(!el||!window.MutationObserver) return;
    new MutationObserver(function(){
      var txt=(el.textContent||'').trim();
      if(txt===el._fxWrote) return;
      runCount(el,txt);
    }).observe(el,{childList:true,characterData:true,subtree:true});
  });

  /* ----- brilho passando na barra de progresso ----- */
  var pf=document.getElementById('progressFill');
  if(pf&&window.MutationObserver){
    var lastW=0;
    new MutationObserver(function(){
      var w=parseFloat(pf.style.width)||0;
      if(FX&&!lite()&&w>lastW){
        pf.classList.remove('fx-shine');void pf.offsetWidth;pf.classList.add('fx-shine');
        clearTimeout(pf._t);pf._t=setTimeout(function(){pf.classList.remove('fx-shine');},950);
      }
      lastW=w;
    }).observe(pf,{attributes:true,attributeFilter:['style']});
  }

  /* ----- ondulação nos botões principais ----- */
  document.addEventListener('pointerdown',function(e){
    if(!FX||lite()) return;
    var b=e.target.closest&&e.target.closest('.save-btn,.cfg-save-btn,.login-btn,.resume-btn,.pwa-install-btn');
    if(!b||b.disabled) return;
    var r=b.getBoundingClientRect(), s=Math.max(r.width,r.height)*2.2, d=document.createElement('span');
    d.className='fx-ripple';
    d.style.cssText='width:'+s+'px;height:'+s+'px;left:'+(e.clientX-r.left-s/2)+'px;top:'+(e.clientY-r.top-s/2)+'px';
    b.appendChild(d); setTimeout(function(){d.remove();},620);
  },{passive:true});

  /* ----- tela "processando" ----- */
  var busyEl=null,busyCount=0,busyShowT=0,busyHideT=0,busySince=0;
  function ensureBusy(){
    if(busyEl) return busyEl;
    busyEl=document.createElement('div'); busyEl.id='fxBusy';
    busyEl.setAttribute('role','status'); busyEl.setAttribute('aria-live','polite');
    busyEl.innerHTML='<div class="fx-busy-card"><div class="fx-busy-orbit"></div><div class="fx-busy-title"></div><div class="fx-busy-sub">Aguarde um instante…</div></div>';
    document.body.appendChild(busyEl); return busyEl;
  }
  function busy(msg){
    var el=ensureBusy(), token={done:false};
    el.querySelector('.fx-busy-title').textContent=msg||'Processando…';
    clearTimeout(busyHideT); busyCount++;
    if(busyCount===1){busyShowT=setTimeout(function(){busySince=performance.now();el.classList.add('show');},280);}
    function done(){
      if(token.done) return; token.done=true;
      busyCount=Math.max(0,busyCount-1);
      if(busyCount>0) return;
      clearTimeout(busyShowT);
      if(!el.classList.contains('show')) return;
      busyHideT=setTimeout(function(){el.classList.remove('show');},Math.max(0,500-(performance.now()-busySince)));
    }
    setTimeout(done,30000); /* segurança: nunca deixa a tela travada */
    return done;
  }
  function wrapBusy(name,msg){
    var fn=window[name]; if(typeof fn!=='function') return;
    window[name]=function(){
      var done=busy(msg), r;
      try{r=fn.apply(this,arguments);}catch(e){done();throw e;}
      if(r&&typeof r.then==='function') return r.then(function(v){done();return v;},function(err){done();throw err;});
      done(); return r;
    };
  }
  wrapBusy('doSave','Sincronizando vistoria…');
  wrapBusy('sendEmailReport','Enviando relatório…');
  wrapBusy('sendCurrentChecklistExcel','Gerando e enviando a planilha…');

  window.MotionFX={enterApp:enterApp,busy:busy,moveIndicator:moveIndicator};
})();
</script>
